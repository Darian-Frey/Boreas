; Boreas MS-42 — PlatformIO configuration.
; Reference copy and rationale: BUILD.md §3.3, D-002, AV-001.
; Platform and libraries are pinned to the exact set verified in Phase 0
; (IMP-002, AV-001). Bump deliberately: change one, rebuild, re-run bringup.

[platformio]
; `pio run` with no -e builds only the firmware.
default_envs = boreas

[env:boreas]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Native USB-Serial/JTAG enumerates as ttyACM0. Without this, auto-detect
; falls back to the laptop's /dev/ttyS0 when the board isn't connected.
; (A /dev/ttyACM* wildcard is passed to esptool unexpanded, so it is not used.)
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi      ; 16 MB flash + 8 MB octal PSRAM (N16R8)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOREAS_LOG_LEVEL=3
  -Wall -Wextra

; U8g2 >= 2.36.19 (ST7305 300x400) is not on the PlatformIO registry
; (latest there is 2.36.18), so it is pinned to a GitHub commit (2.37.1).
lib_deps =
  https://github.com/olikraus/U8g2_Arduino.git#b3a40de8822187c941b40cbbaaa77604a7ab90c7
  bblanchon/ArduinoJson @ 7.4.3
  lewisxhe/SensorLib @ 0.3.1

; Phase 0 peripheral test: builds test/bringup/ instead of src/.
[env:bringup]
extends = env:boreas
build_src_filter = +<../test/bringup/>

; Host-side unit tests for pure code (pio test -e native). Needs only a
; host C++ compiler; Arduino code is never compiled here.
[env:native]
platform = native
test_framework = unity
test_filter = test_*
; Compile the pure modules from src/ into the tests (no Arduino code).
test_build_src = yes
build_src_filter = -<*> +<data/> +<app/Schedule.cpp>
build_flags = -std=gnu++17 -Wall -Wextra -Isrc -Iinclude
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3

; Host preview (D-016): the real ui/ code and U8g2 C core drawn into a
; MemCanvas and written as PNG. Build, then run:
;   pio run -e preview && .pio/build/preview/program --scale 2 -o preview.png
; The U8g2 Arduino package is only downloaded here (lib_ignore stops its
; Arduino C++ wrapper building); its portable clib/ is compiled directly,
; minus the hardware display drivers and their per-display setup tables.
[env:preview]
platform = native
lib_deps = https://github.com/olikraus/U8g2_Arduino.git#b3a40de8822187c941b40cbbaaa77604a7ab90c7
lib_ignore = U8g2
build_flags = -Isrc -Iinclude -I.pio/libdeps/preview/U8g2/src
build_src_flags = -Wall -Wextra
build_src_filter =
  -<*>
  +<display/MemCanvas.cpp>
  +<ui/>
  +<data/>
  +<../tools/preview/>
  +<../.pio/libdeps/preview/U8g2/src/clib/>
  -<../.pio/libdeps/preview/U8g2/src/clib/u8x8_d_*.c>
  -<../.pio/libdeps/preview/U8g2/src/clib/u8g2_d_setup.c>
  -<../.pio/libdeps/preview/U8g2/src/clib/u8g2_d_memory.c>
